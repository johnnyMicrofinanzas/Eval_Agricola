<!DOCTYPE html>
<html lang="es-BO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Scoring AGRÍCOLA — Evaluación de Microcrédito</title>
<meta name="description" content="Sistema de scoring crediticio individual, sector Agrícola. Metodología 5 Cs del Crédito, normativa ASFI Bolivia. Funciona sin conexión a internet.">
<meta name="theme-color" content="#1C5C3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scoring AGRÍCOLA">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root {
  --ink:        #16233F;
  --ink-2:      #45526E;
  --ink-3:      #7C879E;
  --paper:      #EEF1F6;
  --surface:    #FFFFFF;
  --surface-2:  #F3F5F9;
  --surface-3:  #E6EAF2;
  --line:       #D7DEEA;
  --line-soft:  #E7EBF3;

  --brand:      #1C5C3A;
  --brand-2:    #2E8B57;
  --brand-ink:  #0E3320;
  --brand-soft: #E5F3EB;

  --gold:       #B7852E;
  --gold-soft:  #FBF0DA;
  --gold-ink:   #6E4F16;

  --risk-1:      #1C7A4C;
  --risk-1-soft: #E3F5EB;
  --risk-2:      #A87A16;
  --risk-2-soft: #FBF0D9;
  --risk-3:      #B0591E;
  --risk-3-soft: #FBE7D7;
  --risk-4:      #A82A28;
  --risk-4-soft: #FBE2E1;

  --danger:     #A82A28;
  --danger-soft:#FBE2E1;
  --ok:         #1C7A4C;
  --ok-soft:    #E3F5EB;
  --warn:       #A87A16;
  --warn-soft:  #FBF0D9;
  --info:       #1F5FA8;
  --info-soft:  #E7EEF9;

  --radius: 14px;
  --radius-sm: 9px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  font-family: var(--font);
  background: var(--paper);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  padding-bottom: 24px;
}
h1,h2,h3,h4 { margin: 0 0 8px 0; color: var(--ink); }
h1 { font-size: 19px; font-weight: 800; }
h2 { font-size: 15px; font-weight: 800; color: var(--brand-ink); }
h3 { font-size: 13px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing:.03em; }
p { margin: 0 0 8px 0; line-height:1.45; }
button { font-family: inherit; }

/* ---- Top bar ---- */
.appheader { position: sticky; top:0; z-index: 40; }
.topbar {
  background: var(--brand); color: #fff;
  padding: 12px 14px calc(12px + env(safe-area-inset-top,0px));
  padding-top: calc(12px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; gap:10px;
}
.topbar .titles { flex:1; min-width:0; }
.topbar .titles h1 { color:#fff; font-size:16px; }
.topbar .sub { color: var(--brand-soft); font-size:11.5px; opacity:.85; }
.topbar button.icon-btn {
  background: rgba(255,255,255,.12); border:none; color:#fff;
  width:36px; height:36px; border-radius:10px; font-size:18px; cursor:pointer;
}

/* ---- Screens ---- */
.screen { display:none; padding: 14px; max-width: 720px; margin:0 auto; }
.screen.active { display:block; }
.card {
  background: var(--surface); border:1px solid var(--line-soft);
  border-radius: var(--radius); padding:14px; margin-bottom:12px;
  box-shadow: 0 1px 2px rgba(22,35,63,.04);
}
.card + .card { margin-top:12px; }
.hero {
  background: linear-gradient(135deg, var(--brand), var(--brand-ink));
  color:#fff; border-radius: var(--radius); padding:18px; margin-bottom:14px;
}
.hero h1 { color:#fff; font-size:20px; }
.hero p { color: var(--brand-soft); font-size:13px; margin:0; }

.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:420px){ .grid3{grid-template-columns:1fr 1fr;} }

.field { margin-bottom:10px; }
.field label {
  display:block; font-size:11.5px; font-weight:700; color: var(--ink-2);
  margin-bottom:4px; text-transform: uppercase; letter-spacing:.02em;
}
.field input, .field select, .field textarea {
  width:100%; padding:10px 11px; border:1.5px solid var(--line);
  border-radius: var(--radius-sm); font-size:15px; background: var(--surface);
  color: var(--ink); font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline:none; border-color: var(--brand-2);
}
.field .hint { font-size:11px; color: var(--ink-3); margin-top:3px; }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 16px; border-radius:11px; border:none; font-weight:700;
  font-size:14px; cursor:pointer;
}
.btn-primary { background: var(--brand); color:#fff; }
.btn-gold { background: var(--gold); color:#fff; }
.btn-outline { background: var(--surface); color: var(--brand); border:1.5px solid var(--brand); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-block { width:100%; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; }

table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
table.tbl th { text-align:left; font-size:10.5px; text-transform:uppercase; color:var(--ink-3); padding:6px 4px; border-bottom:2px solid var(--line); }
table.tbl td { padding:6px 4px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
table.tbl input, table.tbl select { padding:6px 7px; font-size:13px; border:1px solid var(--line); border-radius:7px; width:100%; }
table.tbl tr.total td { font-weight:800; background: var(--surface-2); }
.tbl-wrap { overflow-x:auto; }

.kpi-row { display:flex; gap:10px; flex-wrap:wrap; }
.kpi { flex:1; min-width:130px; background: var(--surface-2); border-radius: var(--radius-sm); padding:10px 12px; }
.kpi .lbl { font-size:10.5px; color:var(--ink-3); text-transform:uppercase; font-weight:700;}
.kpi .val { font-size:19px; font-weight:800; color: var(--brand-ink); }
.kpi.risk-1 { background: var(--risk-1-soft); } .kpi.risk-1 .val{ color:var(--risk-1);}
.kpi.risk-2 { background: var(--risk-2-soft); } .kpi.risk-2 .val{ color:var(--risk-2);}
.kpi.risk-3 { background: var(--risk-3-soft); } .kpi.risk-3 .val{ color:var(--risk-3);}
.kpi.risk-4 { background: var(--risk-4-soft); } .kpi.risk-4 .val{ color:var(--risk-4);}

.badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:800; }
.badge.risk-1 { background: var(--risk-1-soft); color:var(--risk-1); }
.badge.risk-2 { background: var(--risk-2-soft); color:var(--risk-2); }
.badge.risk-3 { background: var(--risk-3-soft); color:var(--risk-3); }
.badge.risk-4 { background: var(--risk-4-soft); color:var(--risk-4); }
.badge.ok { background:var(--ok-soft); color:var(--ok); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.bad { background:var(--danger-soft); color:var(--danger); }

.alert { border-radius: var(--radius-sm); padding:10px 12px; font-size:13px; margin-bottom:10px; }
.alert.bad { background: var(--danger-soft); color: var(--danger); font-weight:700; }
.alert.warn { background: var(--warn-soft); color: var(--warn-ink,#6E4F16); }
.alert.ok { background: var(--ok-soft); color: var(--ok); }
.alert.info { background: var(--info-soft); color: var(--info); }

.scoring-item { border-bottom:1px solid var(--line-soft); padding:10px 0; }
.scoring-item .head { display:flex; justify-content:space-between; gap:8px; font-size:13px; font-weight:700; margin-bottom:4px;}
.scoring-item .desc { font-size:11.5px; color:var(--ink-3); margin-bottom:6px; }
.scale-opts { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
@media (max-width:380px){ .scale-opts{grid-template-columns:1fr;} }
.scale-opt {
  border:1.5px solid var(--line); border-radius:9px; padding:7px 9px; font-size:12px;
  cursor:pointer; user-select:none; background:var(--surface);
}
.scale-opt.sel-1.active { border-color: var(--risk-1); background: var(--risk-1-soft); color:var(--risk-1); font-weight:700; }
.scale-opt.sel-2.active { border-color: var(--risk-2); background: var(--risk-2-soft); color:var(--risk-2); font-weight:700; }
.scale-opt.sel-3.active { border-color: var(--risk-3); background: var(--risk-3-soft); color:var(--risk-3); font-weight:700; }
.scale-opt.sel-4.active { border-color: var(--risk-4); background: var(--risk-4-soft); color:var(--risk-4); font-weight:700; }
.cat-header {
  background: var(--brand-soft); color: var(--brand-ink); font-weight:800; font-size:13.5px;
  padding:9px 12px; border-radius:9px; margin: 14px 0 8px 0; display:flex; justify-content:space-between;
}

/* ---- Top nav (tabs) ---- */
.topnav {
  background: var(--surface); border-bottom:1px solid var(--line);
  display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width: none;
}
.topnav::-webkit-scrollbar { display:none; }
.topnav button {
  flex: 0 0 auto; background:none; border:none; display:flex; flex-direction:column;
  align-items:center; gap:2px; padding:8px 12px; color: var(--ink-3); font-size:10.5px; font-weight:700;
  cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent;
}
.topnav button .ic { font-size:17px; }
.topnav button.active { color: var(--brand); border-bottom-color: var(--brand); background: var(--brand-soft); }

.list-item {
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:11px 4px; border-bottom:1px solid var(--line-soft);
}
.list-item .meta { font-size:11.5px; color:var(--ink-3); }
.muted { color: var(--ink-3); font-size:12.5px; }
.right { text-align:right; }
.row-flex { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.small-btn { padding:5px 9px; font-size:11.5px; border-radius:7px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; }
.tbl-flujo { font-size: 11.5px; }
.tbl-flujo th, .tbl-flujo td { padding: 5px 6px; white-space: nowrap; }
.tbl-flujo th:first-child, .tbl-flujo td:first-child {
  position: sticky; left: 0; background: var(--surface); text-align: left;
  white-space: normal; min-width: 140px; box-shadow: 2px 0 3px rgba(0,0,0,.05);
}
.tbl-flujo tr.total td:first-child { background: var(--surface-2); }
hr.sep { border:none; border-top:1px dashed var(--line); margin:10px 0; }
.tag { font-size:10.5px; background:var(--surface-3); color:var(--ink-2); padding:2px 7px; border-radius:6px; font-weight:700;}

   IMPRESIÓN — dos modos: "Imprimir Todo" (todas las pantallas) o
   "Imprimir Solo Resolución" (activado agregando .print-resolucion-only al body)
   Resolución: fuente Calibri, títulos 16pt, diseño compacto en hoja Carta.

  body.print-resolucion-only .screen { display: none !important; }

  body.print-resolucion-only #resolucion-imprimible table.tbl-diagnostico { font-size: 6.8pt; width: 100%; border-collapse: collapse; }
  body.print-resolucion-only #resolucion-imprimible table.tbl th,
  body.print-resolucion-only #resolucion-imprimible table.tbl td,
  body.print-resolucion-only #resolucion-imprimible table.tbl-diagnostico th,
  body.print-resolucion-only #resolucion-imprimible table.tbl-diagnostico td { padding: 1.5px 3px; border-bottom: 0.5pt solid #ddd; }
  body.print-resolucion-only #resolucion-imprimible .tbl-diagnostico td:nth-child(7) { min-width: 0; max-width: none; font-size: 6.4pt; }
  body.print-resolucion-only #resolucion-imprimible .grid3 .mini-field,
  body.print-resolucion-only #resolucion-imprimible .datos-actividad .mini-field { padding: 2px 4px; }
  body.print-resolucion-only #resolucion-imprimible .mini-field label { font-size: 5.6pt; }
  body.print-resolucion-only #resolucion-imprimible .mini-field .mini-val { font-size: 6.6pt; }
  body.print-resolucion-only #resolucion-imprimible .kpi { padding: 3px 5px; }
  body.print-resolucion-only #resolucion-imprimible .kpi .lbl { font-size: 5.8pt; }
  body.print-resolucion-only #resolucion-imprimible .kpi .val { font-size: 9pt; }
  body.print-resolucion-only #resolucion-imprimible .badge { font-size: 6.5pt; padding: 1.5px 5px; }
  body.print-resolucion-only #resolucion-imprimible .alert { font-size: 6.6pt; padding: 3px 5px; }
  body.print-resolucion-only #resolucion-imprimible hr.sep { margin: 4px 0; }
}

.datos-actividad { gap: 8px; }
.mini-field { background: var(--surface-2); border-radius: 8px; padding: 7px 9px; }
.mini-field label { display:block; font-size:9.5px; font-weight:700; color:var(--ink-3); text-transform:uppercase; letter-spacing:.02em; margin-bottom:2px; }
.mini-field .mini-val { font-size:12px; color:var(--ink); line-height:1.3; }
@media (max-width:480px){ .datos-actividad{ grid-template-columns: 1fr 1fr; } }

.scoring-item.sin-responder { background: var(--warn-soft); border-radius: 9px; padding: 10px 8px; margin: 0 -8px 0 -8px; }
.tag.bad { background: var(--danger-soft); color: var(--danger); }

.tbl-diagnostico { font-size: 10.5px; }
.tbl-diagnostico th, .tbl-diagnostico td { padding: 5px 6px; }
.tbl-diagnostico td:nth-child(7), .tbl-diagnostico td:nth-child(8) { min-width: 180px; max-width: 240px; white-space: normal; line-height: 1.35; }

.tag.ok { background: var(--ok-soft); color: var(--ok); }

.garantia-card { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; }
.garantia-tipo { font-weight: 700; font-size: 13.5px; color: var(--brand-ink); margin-bottom: 8px; }
.garantia-ponderado { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }

.tbl-campana input.cell-num { width: 55px; font-size: 11px; padding: 2px; }
.tbl-campana th, .tbl-campana td { font-size: 11px; padding: 3px 4px; }

.tbl-campana tr.cat-header td { background: var(--surface-2); font-weight: 700; font-size: 11px; padding: 4px 6px; }

<body>

<div class="appheader">
  <div class="topbar">
    <div class="titles">
      <h1>Scoring AGRÍCOLA</h1>
      <div class="sub">Microcrédito Individual · 5 Cs del Crédito · 1000 pts</div>
    </div>
    <button class="icon-btn" onclick="goScreen('inicio')" title="Inicio">🏠</button>
  </div>
  <div class="topnav">
    <button data-nav="inicio"><span class="ic">🏠</span>Inicio</button>

<script>
function num(v){ v = parseFloat(v); return isNaN(v) ? 0 : v; }
function fmtBs(v){ if(!isFinite(v)) return '—'; return 'Bs. ' + v.toLocaleString('es-BO',{minimumFractionDigits:0, maximumFractionDigits:0}); }
function fmtNum(v,d=2){ if(!isFinite(v)) return '—'; return v.toLocaleString('es-BO',{maximumFractionDigits:d}); }
function fmtPct(v){ if(!isFinite(v)) return '—'; return (v*100).toLocaleString('es-BO',{maximumFractionDigits:1}) + '%'; }

function mesesPorPeriodo(modalidad){
  const map = {'Mensual':1,'Bimestral':2,'Trimestral':3,'Semestral':6,'Anual':12};
  return map[modalidad] || 1;
}

// ============================================================================
// PRODUCTOS AGRÍCOLAS — resumen consolidado por producto (reemplaza el Flujo
// mensual de Comercio/Producción/Servicios; en Agrícola el flujo real se arma
// por campaña agrícola, aquí se usa el resumen consolidado por producto que
// ya trae el Excel en "E. RESUMEN CONSOLIDADO POR PRODUCTO").
// ============================================================================
// ============================================================================
// CAMPAÑA / FLUJO POR PRODUCTO — réplica fiel de las hojas "Campaña-N" y
// "Flujo-N": 6 etapas del ciclo (subtotal mensual editable, tal como lo
// consume Flujo-N) + Ingresos por venta de producto/subproductos por mes.
// ============================================================================
function calcCampana(campana, numMeses){
  const n = numMeses || 12;
  const etapas = ETAPAS_ORDEN.map(etapaNombre => {
    const items = (campana.etapas[etapaNombre]||[]).map(it => {
      const meses = Array.from({length:n},(_,i) => num((it.meses||[])[i]));
      const total = meses.reduce((a,v)=>a+v,0);
      return { label: it.label, meses, total };
    });
    const meses = Array.from({length:n},(_,i) => items.reduce((a,it)=>a+it.meses[i],0));
    const total = meses.reduce((a,v)=>a+v,0);
    return { etapa: etapaNombre, items, meses, total };
  });
  const egresosPorMes = Array.from({length:n},(_,i) => etapas.reduce((a,e)=>a+e.meses[i],0));
  const ingresosPorMes = Array.from({length:n},(_,i) => (campana.ingresos||[]).reduce((a,ing)=>a+num((ing.meses||[])[i]),0));
  const totalIngresos = ingresosPorMes.reduce((a,v)=>a+v,0);
  const totalEgresos = egresosPorMes.reduce((a,v)=>a+v,0);
  const flujoNeto = Array.from({length:n},(_,i)=> ingresosPorMes[i]-egresosPorMes[i]);
  let acum = 0;
  const flujoAcumulado = flujoNeto.map(v => (acum += v));
  const utilidadNeta = totalIngresos - totalEgresos;
  const margenRentabilidad = totalIngresos ? utilidadNeta/totalIngresos : 0;
  const rc = totalEgresos ? utilidadNeta/totalEgresos : 0;
  return { etapas, egresosPorMes, ingresosPorMes, totalIngresos, totalEgresos, flujoNeto, flujoAcumulado, utilidadNeta, margenRentabilidad, rc };
}

function calcFlujoConsolidado(S){
  // El Flujo dura lo mismo que el Plazo Solicitado (meses) — tal como el Excel,
  // donde el ciclo de la campaña se alinea al plazo del crédito.
  const numMeses = Math.max(1, num(S.credito.plazoMeses) || 12);
  const campanas = (S.campanas||[]).map(c => ({ ...c, calc: calcCampana(c, numMeses) }));

  // A. Ingresos Totales (suma de todos los productos, mes a mes)
  const ingresosPorMes = Array.from({length:numMeses},(_,i)=> campanas.reduce((a,c)=>a+c.calc.ingresosPorMes[i],0));
  const subtotalIngresos = ingresosPorMes.reduce((a,v)=>a+v,0);

  // B. Egresos Totales (suma de todos los productos, mes a mes)
  const egresosPorMes = Array.from({length:numMeses},(_,i)=> campanas.reduce((a,c)=>a+c.calc.egresosPorMes[i],0));
  const subtotalEgresos = egresosPorMes.reduce((a,v)=>a+v,0);

  // C. Gastos Operativos Fijos Mensuales del Negocio (constante cada mes)
  const fg = S.flujoGastos||{};
  const gastosOperativos = Object.values(fg).reduce((a,v)=>a+num(v),0);
  const utilidadOperativaPorMes = Array.from({length:numMeses},(_,i)=> ingresosPorMes[i]-egresosPorMes[i]-gastosOperativos);

  // D. + Otros Ingresos Estables fuera del negocio (constante cada mes)
  const oi = S.otrosIngresos||{};
  const otrosIngresos = Object.values(oi).reduce((a,v)=>a+num(v),0);

  // E. Gastos Fijos Familiares Mensuales (constante cada mes)
  const gf = S.gastosFamiliares||{};
  const gastosFamiliares = Object.values(gf).reduce((a,v)=>a+num(v),0);

  // Saldo Disponible Consolidado = Utilidad Operativa + Otros Ingresos - Gastos Familiares
  const saldoDisponiblePorMes = utilidadOperativaPorMes.map(u => u+otrosIngresos-gastosFamiliares);

  // Servicio de deuda (cuota del crédito solicitado, Sistema Francés) — respeta la
  // Modalidad de Pago: el monto completo aparece solo en los meses de pago reales
  // (ej. Semestral = cada 6 meses), no repartido en partes iguales cada mes.
  const credito = calcCredito(S);
  const mpp = credito.mpp || 1;
  const mesesGracia = num(S.credito.mesesGracia);
  const cuotaPorMes = Array.from({length:numMeses},(_,i) => {
    const enGracia = i < mesesGracia;
    const esMesDePago = enGracia ? ((i+1) % mpp === 0) : (((i-mesesGracia+1)) % mpp === 0);
    if (!esMesDePago) return 0;
    return enGracia ? credito.cuotaGracia : credito.cuotaAmort;
  });
  const cuotaMensualEquiv = mpp>0 ? credito.cuotaAmort/mpp : credito.cuotaAmort;

  const capacidadPagoPorMes = saldoDisponiblePorMes.map((s,i) => s-cuotaPorMes[i]);
  let acum = 0;
  const flujoAcumuladoPorMes = capacidadPagoPorMes.map(v => (acum += v));

  const saldoDisponibleProm = saldoDisponiblePorMes.reduce((a,v)=>a+v,0)/numMeses;
  const coberturaCuota = cuotaMensualEquiv ? saldoDisponibleProm/cuotaMensualEquiv : 0;
  const ingresoTotalProm = (subtotalIngresos+otrosIngresos*numMeses)/numMeses;
  const dti = ingresoTotalProm ? cuotaMensualEquiv/ingresoTotalProm : 0;

  const totalIngresoBruto = subtotalIngresos;
  const totalCostoTotal = subtotalEgresos;
  const totalUtilidadNeta = subtotalIngresos - subtotalEgresos;
  const totalSuperficie = campanas.reduce((a,c)=>a+num(c.superficie),0);
  const totalCapacidadPago = capacidadPagoPorMes.reduce((a,v)=>a+v,0)/numMeses;

  return { campanas, numMeses, ingresosPorMes, egresosPorMes, subtotalIngresos, subtotalEgresos,
    gastosOperativos, utilidadOperativaPorMes, otrosIngresos, gastosFamiliares,
    saldoDisponiblePorMes, cuotaMensualEquiv, cuotaPorMes, capacidadPagoPorMes, flujoAcumuladoPorMes,
    coberturaCuota, dti, totalIngresoBruto, totalCostoTotal, totalUtilidadNeta, totalSuperficie, totalCapacidadPago };
}

function calcProductos(S){
  // Mantiene compatibilidad con Resolución/Scoring — ahora alimentado por el
  // Flujo Consolidado real (Campaña + Flujo por producto), no por un resumen manual.
  const fc = calcFlujoConsolidado(S);
  const productos = fc.campanas.map(c => ({
    producto: c.producto, superficie: c.superficie,
    ingresoBruto: c.calc.totalIngresos, costoTotal: c.calc.totalEgresos,
    utilidadNeta: c.calc.utilidadNeta, capacidadPago: c.calc.utilidadNeta/12, rc: c.calc.rc,
  }));
  return { productos, totalSuperficie: fc.totalSuperficie, totalIngresoBruto: fc.totalIngresoBruto,
    totalCostoTotal: fc.totalCostoTotal, totalUtilidadNeta: fc.totalUtilidadNeta,
    totalCapacidadPago: fc.totalCapacidadPago, flujoConsolidado: fc };
}

// ============================================================================
// CRÉDITO — cuota por Sistema Francés, verificado contra DATOS CLIENTE!C33/C35
// ============================================================================
function calcCredito(S){
  const cr = S.credito;
  const monto = num(cr.monto), plazo = num(cr.plazoMeses), tasa = num(cr.tasaInteres);
  const mesesGracia = num(cr.mesesGracia);
  const mpp = mesesPorPeriodo(cr.modalidadPago);
  const tasaPeriodo = (tasa/12) * mpp;
  const nCuotasNormales = mpp>0 ? (plazo - mesesGracia)/mpp : 0;
  const cuotaGraciaPeriodica = monto * tasaPeriodo;
  const cuotaPeriodica = (tasaPeriodo===0 || nCuotasNormales<=0) ? (nCuotasNormales>0?monto/nCuotasNormales:0)
    : (monto*tasaPeriodo*Math.pow(1+tasaPeriodo,nCuotasNormales))/(Math.pow(1+tasaPeriodo,nCuotasNormales)-1);
  const cuotaAmort = cuotaPeriodica; // cuota REAL por período (Sistema Francés), tal cual Excel
  const cuotaGracia = cuotaGraciaPeriodica;
  return { monto, plazo, tasa, cuotaGracia, cuotaAmort, cuotaPeriodica, mpp };
}

// ============================================================================
// SCORING — idéntico en estructura a los otros sectores (criterios 5 Cs)
// ============================================================================
function calcScoring(S){
  const respuestas = S.scoring || {};
  const porCategoria = {};
  let total = 0, pendientes = 0;
  let currentCat = null;
  SCORING_CRITERIA.forEach(row=>{
    if (row.type === 'cat'){ currentCat = row.label; porCategoria[currentCat] = {ptsmax:row.ptsmax, obtenido:0}; return; }
    const r = respuestas[row.id];
    let pts = 0;
    if (r === 1) pts = row.ptsmax;
    else if (r === 2) pts = row.ptsmax/1.5;
    else if (r === 3) pts = row.ptsmax/2;
    else if (r === 4) pts = 0;
    else { pendientes++; pts = 0; }
    total += pts;
    if (porCategoria[currentCat]) porCategoria[currentCat].obtenido += pts;
  });
  const pd = 1/(1+Math.exp((total-500)/40));
  const categoriaRiesgo = total>=800?'RIESGO BAJO':total>=600?'RIESGO MEDIO':'RIESGO ALTO';
  return { total, porCategoria, pendientes, pd, categoriaRiesgo };
}

// Mora / requisito excluyente (idéntico patrón a los otros sectores)
function calcAlertaMora(S){
  const r = S.scoring||{};
  const deudor = num(r['1.2']), codeudor = num(r['1.3']), garante = num(r['1.4']);
  return (deudor>=2 && codeudor>=2) || (deudor>=2 && garante>=2) || (codeudor>=2 && garante>=2)
      || deudor>=2 || codeudor>=2 || garante>=2;
}

// ============================================================================
// RAC — Rentabilidad Ajustada al Capital (verificado: SCORING!I89-I94, fórmula
// simple PD×Monto, SIN factor de garantía — tal cual está en el Excel Agrícola)
// ============================================================================
function calcRAC(S, scoring, colateral){
  const cr = S.credito;
  const monto = num(cr.monto), plazo = num(cr.plazoMeses), tasa = num(cr.tasaInteres);
  const gastosAdmin = num(cr.gastosAdmin), costoFinanciero = num(cr.costoFinanciero);
  const ingresosIntereses = monto*tasa*(plazo/12);
  const costoFinancieroBs = monto*costoFinanciero*(plazo/12);
  const gastosAdminBs = monto*gastosAdmin*(plazo/12);
  // LGD = % que realmente se pierde si el cliente incumple, después de recuperar
  // garantías y otros valores = (Monto - Garantía Recuperable Ponderada) / Monto.
  // Puede ser negativo si la garantía ponderada supera el monto del crédito.
  const lgd = monto ? (monto - colateral.totalPonderado) / monto : 1.0;
  const perdidaEsperada = scoring.pd * monto * lgd;
  const resultadoNeto = ingresosIntereses - costoFinancieroBs - gastosAdminBs - perdidaEsperada;
  const racGenerado = monto ? resultadoNeto/monto : 0;
  const racRequerido = num(cr.racRequerido || 0.05);
  return { ingresosIntereses, costoFinancieroBs, gastosAdminBs, lgd, perdidaEsperada, resultadoNeto, racGenerado, racRequerido };
}

// ============================================================================
// COLATERAL
// ============================================================================
function calcColateral(S){
  const garantias = (S.colateral.garantias||[]).map(g => ({...g, ponderado: num(g.valor)*num(g.pctCobertura)}));
  const totalValor = garantias.reduce((a,g)=>a+num(g.valor),0);
  const totalPonderado = garantias.reduce((a,g)=>a+g.ponderado,0);
  const monto = num(S.credito.monto);
  const ltv = totalValor ? monto/totalValor : 0;
  const ratioCoberturaBruta = monto ? totalValor/monto : 0;
  const ratioCoberturaPonderada = monto ? totalPonderado/monto : 0;
  return { garantias, totalValor, totalPonderado, ltv, ratioCoberturaBruta, ratioCoberturaPonderada };
}

// BALANCE

const BALANCE_LINEAS = [
  {grp:'activoCorriente', key:'caja', label:'Caja y Efectivo'},
  {grp:'activoCorriente', key:'bancos', label:'Bancos'},
  {grp:'activoCorriente', key:'inventario', label:'Inventario/Mercadería'},
  {grp:'activoCorriente', key:'cxc', label:'Cuentas por Cobrar'},
  {grp:'activoCorriente', key:'otros', label:'Otros Activos Corr.'},
  {grp:'activoNoCorriente', key:'equipos', label:'Equipos/Maquinaria'},
  {grp:'activoNoCorriente', key:'mobiliario', label:'Mobiliario'},
  {grp:'activoNoCorriente', key:'vehiculos', label:'Vehículos'},
  {grp:'activoNoCorriente', key:'inmuebles', label:'Inmuebles'},
  {grp:'activoNoCorriente', key:'otros', label:'Otros Activos No Corr.'},
  {grp:'pasivoCorriente', key:'cxp', label:'Cuentas por Pagar'},
  {grp:'pasivoCorriente', key:'cuotaSF', label:'Créditos SF (cuota actual)'},
  {grp:'pasivoCorriente', key:'deudasComerciales', label:'Deudas Comerciales'},

  {grp:'pasivoNoCorriente', key:'deudasLP', label:'Deudas LP > 1 año'},
  {grp:'pasivoNoCorriente', key:'otros', label:'Otros Pasivos No Corr.'},
  {grp:'patrimonio', key:'capitalInicial', label:'Capital Propio Inicial'},
  {grp:'patrimonio', key:'utilidadesRetenidas', label:'Utilidades Retenidas'},
  {grp:'patrimonio', key:'otrosAportes', label:'Otros Aportes'},
];

function calcBalance(S, fc){
  const b = S.balance;
  const sum = o => Object.values(o||{}).reduce((a,v)=>a+num(v),0);
  const totalActivoCorrienteAct = sum(b.actual.activoCorriente), totalActivoNoCorrienteAct = sum(b.actual.activoNoCorriente);
  const totalActivoAct = totalActivoCorrienteAct + totalActivoNoCorrienteAct;
  const totalPasivoCorrienteAct = sum(b.actual.pasivoCorriente), totalPasivoNoCorrienteAct = sum(b.actual.pasivoNoCorriente);
  const totalPasivoAct = totalPasivoCorrienteAct + totalPasivoNoCorrienteAct;
  const totalPatAct = sum(b.actual.patrimonio);
  const totalActivoCorrienteAnt = sum(b.anterior.activoCorriente), totalActivoNoCorrienteAnt = sum(b.anterior.activoNoCorriente);
  const totalActivoAnt = totalActivoCorrienteAnt + totalActivoNoCorrienteAnt;
  const totalPasivoCorrienteAnt = sum(b.anterior.pasivoCorriente), totalPasivoNoCorrienteAnt = sum(b.anterior.pasivoNoCorriente);
  const totalPasivoAnt = totalPasivoCorrienteAnt + totalPasivoNoCorrienteAnt;
  const totalPatAnt = sum(b.anterior.patrimonio);
  const verificacion = Math.abs((totalPasivoAct+totalPatAct) - totalActivoAct) < 1;
  const verificacionAnt = Math.abs((totalPasivoAnt+totalPatAnt) - totalActivoAnt) < 1;

  // ---- Análisis horizontal línea por línea (Anterior → Actual) ----
  const horizontal = BALANCE_LINEAS.map(l => {
    const vAnt = num((b.anterior[l.grp]||{})[l.key]);
    const vAct = num((b.actual[l.grp]||{})[l.key]);
    const varBs = vAct - vAnt;
    const varPct = vAnt !== 0 ? varBs/vAnt : 0;
    return {...l, vAnt, vAct, varBs, varPct};
  });
  const totalesHorizontal = [
    {label:'TOTAL ACTIVO CORRIENTE', vAnt:totalActivoCorrienteAnt, vAct:totalActivoCorrienteAct, varBs:totalActivoCorrienteAct-totalActivoCorrienteAnt, varPct: totalActivoCorrienteAnt?(totalActivoCorrienteAct-totalActivoCorrienteAnt)/totalActivoCorrienteAnt:0},
    {label:'TOTAL ACTIVO NO CORRIENTE', vAnt:totalActivoNoCorrienteAnt, vAct:totalActivoNoCorrienteAct, varBs:totalActivoNoCorrienteAct-totalActivoNoCorrienteAnt, varPct: totalActivoNoCorrienteAnt?(totalActivoNoCorrienteAct-totalActivoNoCorrienteAnt)/totalActivoNoCorrienteAnt:0},
    {label:'TOTAL ACTIVO', vAnt:totalActivoAnt, vAct:totalActivoAct, varBs:totalActivoAct-totalActivoAnt, varPct: totalActivoAnt?(totalActivoAct-totalActivoAnt)/totalActivoAnt:0},
    {label:'TOTAL PASIVO CORRIENTE', vAnt:totalPasivoCorrienteAnt, vAct:totalPasivoCorrienteAct, varBs:totalPasivoCorrienteAct-totalPasivoCorrienteAnt, varPct: totalPasivoCorrienteAnt?(totalPasivoCorrienteAct-totalPasivoCorrienteAnt)/totalPasivoCorrienteAnt:0},
    {label:'TOTAL PASIVO NO CORRIENTE', vAnt:totalPasivoNoCorrienteAnt, vAct:totalPasivoNoCorrienteAct, varBs:totalPasivoNoCorrienteAct-totalPasivoNoCorrienteAnt, varPct: totalPasivoNoCorrienteAnt?(totalPasivoNoCorrienteAct-totalPasivoNoCorrienteAnt)/totalPasivoNoCorrienteAnt:0},
    {label:'TOTAL PASIVO', vAnt:totalPasivoAnt, vAct:totalPasivoAct, varBs:totalPasivoAct-totalPasivoAnt, varPct: totalPasivoAnt?(totalPasivoAct-totalPasivoAnt)/totalPasivoAnt:0},
    {label:'PATRIMONIO NETO', vAnt:totalPatAnt, vAct:totalPatAct, varBs:totalPatAct-totalPatAnt, varPct: totalPatAnt?(totalPatAct-totalPatAnt)/totalPatAnt:0},
  ];

  // ---- Análisis vertical (% sobre Total Activo, anterior vs actual, con tendencia) ----
  const vert = (vAntNum, vActNum) => {
    const pAnt = totalActivoAnt? vAntNum/totalActivoAnt:0;
    const pAct = totalActivoAct? vActNum/totalActivoAct:0;
    return {pAnt, pAct, tendencia: pAct>pAnt?'↑ Aumenta':'↓ Baja'};
  };
  const vertical = {
    ac: vert(totalActivoCorrienteAnt, totalActivoCorrienteAct),
    anc: vert(totalActivoNoCorrienteAnt, totalActivoNoCorrienteAct),
    pc: vert(totalPasivoCorrienteAnt, totalPasivoCorrienteAct),
    pasivo: vert(totalPasivoAnt, totalPasivoAct),
    patrimonio: vert(totalPatAnt, totalPatAct),
  };

  // ---- Ratios Financieros (período actual) — usa el Flujo Consolidado agrícola
  // en vez de Ventas/CMV mensuales de comercio (ingresos y egresos de campañas) ----
  const ingresoMes = fc ? fc.ingresosPorMes.reduce((a,v)=>a+v,0)/fc.numMeses : 0;
  const egresoMes = fc ? fc.egresosPorMes.reduce((a,v)=>a+v,0)/fc.numMeses : 0;
  const capacidadPagoMes = fc ? fc.capacidadPagoPorMes.reduce((a,v)=>a+v,0)/fc.numMeses : 0;
  const ratio = (n_, d_) => d_ ? n_/d_ : 0;
  const inv = num(b.actual.activoCorriente.inventario), caja = num(b.actual.activoCorriente.caja),
    bancos = num(b.actual.activoCorriente.bancos), cxc = num(b.actual.activoCorriente.cxc),
    cuotaSF = num(b.actual.pasivoCorriente.cuotaSF);
  const liquidezCorriente = ratio(totalActivoCorrienteAct, totalPasivoCorrienteAct);
  const pruebaAcida = ratio(totalActivoCorrienteAct-inv, totalPasivoCorrienteAct);
  const ratioEfectivo = ratio(caja+bancos, totalPasivoCorrienteAct);
  const rotacionCxC = ratio(ingresoMes, cxc);
  const periodoCobro = ratio(30, rotacionCxC);
  const rotacionInventario = ratio(egresoMes, inv);
  const deudaPatrimonio = ratio(totalPasivoAct, totalPatAct);
  const endeudamientoTotal = ratio(totalPasivoAct, totalActivoAct);
  const coberturaDeudaSF = ratio(cuotaSF, ingresoMes);
  const roa = ratio(capacidadPagoMes, totalActivoAct);
  const roe = ratio(capacidadPagoMes, totalPatAct);

  return { totalActivoAct, totalPasivoAct, totalPatAct, totalActivoAnt, totalPasivoAnt, totalPatAnt,
    totalActivoCorrienteAct, totalActivoNoCorrienteAct, totalPasivoCorrienteAct, totalPasivoNoCorrienteAct,
    verificacion, verificacionAnt, horizontal, totalesHorizontal, vertical,
    liquidezCorriente, pruebaAcida, ratioEfectivo, rotacionCxC, periodoCobro, rotacionInventario,
    deudaPatrimonio, endeudamientoTotal, coberturaDeudaSF, roa, roe };
}

// ============================================================================
// II. COMPONENTES DEL SCORING FINAL CONSOLIDADO (tal cual Excel: pesos fijos
// 30/40/20/10 sobre Score 5Cs / Cobertura Cuota / RAC / PD)
// ============================================================================
function calcComponentes(S, scoring, productos, credito, rac){
  const coberturaCuota = productos.flujoConsolidado.coberturaCuota;

  const comp1 = scoring.total>=800 ? 300 : scoring.total>=600 ? 150 : scoring.total<600 ? 100 : 12.5;
  const comp2 = coberturaCuota>=2 ? 400 : coberturaCuota>=1.5 ? 200.5 : coberturaCuota>=0.5 ? 100 : 62.5;
  const comp3 = rac.racGenerado>=0.059 ? 200 : rac.racGenerado>=0.05 ? 100 : rac.racGenerado<=0.05 ? 0 : 25;
  const comp4 = scoring.pd<=0.01 ? 100 : scoring.pd>0.01 ? 66.6666666667 : scoring.pd>=0.5 ? 50 : 12.5;

  const scoreFinal = comp1+comp2+comp3+comp4;
  const categoriaFinal = scoreFinal>=800?'BAJO RIESGO':scoreFinal>=600?'RIESGO MEDIO — CONDICIONES':scoreFinal>=400?'RIESGO ALTO':'RIESGO MUY ALTO';
  const nivelAprobacion = scoreFinal>=800?'Asesor de Crédito':scoreFinal>=600?'Jefe de Agencia':'Gerencia / Comité';

  const componentes = [
    {n:1, nombre:'Score 5Cs del Crédito', peso:0.3, ptsMax:300, obtenido:comp1},
    {n:2, nombre:'Cobertura de Cuota (SD/Cuota)', peso:0.4, ptsMax:400, obtenido:comp2},
    {n:3, nombre:'RAC — Rentabilidad Ajustada al Capital', peso:0.2, ptsMax:200, obtenido:comp3},
    {n:4, nombre:'Probabilidad de Default (PD Mora)', peso:0.1, ptsMax:100, obtenido:comp4},
  ];
  return { componentes, coberturaCuota, scoreFinal, categoriaFinal, nivelAprobacion };
}

function comentarioCategoria(categoria, pct){
  const c = categoria.toUpperCase();
  if (c.includes('CARACTER')) {
    if (pct>=0.9) return 'Excelente historial crediticio — Bajo riesgo';
    if (pct>=0.7) return 'Buen historial crediticio — Riesgo moderado';
    if (pct>=0.5) return 'Historial irregular — Riesgo a vigilar';
    return 'Historial deficiente — Factor de riesgo crítico';
  }
  if (c.includes('CAPACIDAD')) {
    if (pct>=0.9) return 'Capacidad de pago sólida — Bajo riesgo';
    if (pct>=0.7) return 'Capacidad de pago adecuada — Riesgo moderado';
    if (pct>=0.5) return 'Capacidad insuficiente — Riesgo de mora elevado';
    return 'Capacidad de pago crítica — Alto riesgo de mora';
  }
  if (c.includes('CAPITAL')) {
    if (pct>=0.9) return 'Capital y patrimonio sólidos — Bajo riesgo';
    if (pct>=0.7) return 'Capital adecuado — Riesgo moderado';
    if (pct>=0.5) return 'Historial deficiente — Factor de riesgo critico';
    return 'Capital insuficiente — Alto riesgo';
  }
  if (c.includes('CONDICIONES')) {
    if (pct>=0.9) return 'Condiciones favorables — Bajo riesgo';
    if (pct>=0.7) return 'Condiciones moderadas — vigilar sector';
    if (pct>=0.5) return 'Condiciones desfavorables — riesgo elevado';
    return 'Condiciones muy desfavorables — alto riesgo';
  }
  if (c.includes('COLATERAL')) {
    if (pct>=0.9) return 'Garantías sólidas — Bajo riesgo';
    if (pct>=0.7) return 'Garantías adecuadas — Riesgo moderado';
    if (pct>=0.5) return 'Garantias insuficientes — alto riesgo de perdida';
    return 'Sin garantías suficientes — Riesgo crítico';
  }
  return pct>=0.7 ? 'Adecuado' : pct>=0.5 ? 'Moderado' : 'Deficiente';
}

function calcTodo(S){
  const productos = calcProductos(S);
  const credito = calcCredito(S);
  const balance = calcBalance(S, productos.flujoConsolidado);
  const colateral = calcColateral(S);
  const scoring = calcScoring(S);
  const alertaMora = calcAlertaMora(S);
  const rac = calcRAC(S, scoring, colateral);
  const resolucion = calcComponentes(S, scoring, productos, credito, rac);
  return { productos, credito, balance, colateral, scoring, alertaMora, rac, resolucion };
}

function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function setPath(obj, path, value){
  const parts = path.split('.');
  let o = obj;
  for (let i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  o[parts[parts.length-1]] = value;
}
function goScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = document.getElementById('screen-'+name);

}
function escAttr(v){ return (v===undefined||v===null) ? '' : String(v).replace(/"/g,'&quot;'); }

function attachBindings(container){
  container.querySelectorAll('[data-path]').forEach(el=>{
    const handler = () => {
      let v = el.value;
      if (el.type==='number') v = v===''? '' : parseFloat(v);
      setPath(S, el.dataset.path, v);
      recalc();
    };
    el.addEventListener('input', handler);
    if (el.tagName === 'SELECT') el.addEventListener('change', handler);
  });
}
function field(label, path, type='text', extra=''){
  const v = getPath(S, path);
  return `<div class="field"><label>${label}</label><input type="${type}" ${extra} data-path="${path}" value="${escAttr(v)}"></div>`;
}
function selectField(label, path, options){
  const v = getPath(S, path);
  return `<div class="field"><label>${label}</label><select data-path="${path}">
    <option value="">—</option>
    ${options.map(o=>`<option value="${o}" ${o===v?'selected':''}>${o}</option>`).join('')}

}

function updateBalanceSubtotals(){
  ['activoCorriente','activoNoCorriente','pasivoCorriente','pasivoNoCorriente','patrimonio'].forEach(grp=>{
    ['anterior','actual'].forEach(periodo=>{
      const obj = (S.balance[periodo]||{})[grp] || {};

function renderGarantiasTable(){

  box.innerHTML = S.colateral.garantias.map((g,i)=>`
    <div class="garantia-card">
      <div class="garantia-tipo">${g.tipo}</div>
      <div class="grid2">
        <div class="field"><label>Valor Comercial (Bs.)</label>
          <input type="number" step="0.01" placeholder="0" value="${escAttr(g.valor??'')}" data-gidx="${i}" data-gfield="valor"></div>
        <div class="field"><label>% Cobertura</label>
          <input type="number" step="1" value="${escAttr(g.pctCobertura!=null? Math.round(g.pctCobertura*100):'')}" data-gidx="${i}" data-gfield="pctCoberturaPct"></div>
      </div>
      <div class="garantia-ponderado">Ponderado: <b>${fmtBs(num(g.valor)*num(g.pctCobertura))}</b></div>
    </div>`).join('');
  box.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const idx = parseInt(inp.dataset.gidx);
      if (inp.dataset.gfield === 'pctCoberturaPct'){
        S.colateral.garantias[idx].pctCobertura = (parseFloat(inp.value)||0)/100;
      } else {
        S.colateral.garantias[idx].valor = parseFloat(inp.value)||0;
      }
      recalc();
      renderGarantiasTable();
    });
  });

          ${[1,2,3,4].map(n=>`<div class="scale-opt sel-${n} ${sel==n?'active':''}" data-crit="${row.id}" data-val="${n}">
            <b>${n}.</b> ${row['e'+n]||''}</div>`).join('')}
        </div>
      </div>`;
    }
  });
  html += `<div class="card" id="scoring-rac"></div>`;
  el.innerHTML = html;
  el.querySelectorAll('.scale-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      S.scoring[opt.dataset.crit] = parseInt(opt.dataset.val);
      recalc();
      renderScoring();
    });
  });
  renderScoringAlert();
  renderScoringRAC();
}
function renderScoringAlert(){
  const box = document.getElementById('scoring-alert');
  if (!box) return;
  const R = calcTodo(S);
  let html = '';
  if (R.scoring.pendientes>0) html += `<div class="alert warn">⚠ Hay ${R.scoring.pendientes} criterio(s) sin responder — cuentan como 0 puntos.</div>`;
  if (R.alertaMora) html += `<div class="alert bad">⚠ El solicitante tiene una o varias operaciones en mora como deudor, codeudor o garante — SUSPENDER LA EVALUACIÓN.</div>`;
  box.innerHTML = html;
}

// ---------------------------------------------------------------------------
// GUARDADAS (simplificado)
// ---------------------------------------------------------------------------
const STORAGE_KEY = 'evaluaciones_agricola_v1';
function getGuardadas(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e){ return []; } }
function imprimirTodo(){
  document.body.classList.remove('print-resolucion-only');
  window.print();
}
function imprimirResolucion(){
  document.body.classList.add('print-resolucion-only');
  window.print();
  setTimeout(()=>document.body.classList.remove('print-resolucion-only'), 500);
}
function guardarEvaluacion(){
  const list = getGuardadas();
  const nombreCompleto = [S.cliente.nombres, S.cliente.apPaterno].filter(Boolean).join(' ') || 'Sin nombre';
  list.unshift({ id: Date.now(), nombre: nombreCompleto, fecha: S.meta.fecha, estado: JSON.parse(JSON.stringify(S)) });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0,50)));
  alert('Evaluación guardada.');
  renderGuardadas();
}
function cargarEvaluacion(id){
  const list = getGuardadas();
  const item = list.find(x=>x.id===id);
  if (!item) return;
  S = item.estado;
  renderAll();
  goScreen('resolucion');
}
function eliminarEvaluacion(id){
  const list = getGuardadas().filter(x=>x.id!==id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  renderGuardadas();
}
function renderGuardadas(){
  const el = document.getElementById('screen-guardadas');
  if (!el) return;
  const list = getGuardadas();
  el.innerHTML = `<h1>Evaluaciones Guardadas</h1>
    ${list.length===0 ? '<p class="muted">No hay evaluaciones guardadas.</p>' : list.map(item=>`
      <div class="card">
        <div class="row-flex"><b>${item.nombre}</b><span class="muted">${item.fecha||''}</span></div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn btn-outline" onclick="cargarEvaluacion(${item.id})">Abrir</button>
          <button class="btn btn-outline" onclick="eliminarEvaluacion(${item.id})">Eliminar</button>
        </div>
      </div>`).join('')}`;
}

// ---------------------------------------------------------------------------
function recalc(){
  updateBalanceSubtotals();
  renderBalanceResultado();
  renderColateralResultado();
  renderFlujoResultado();
  renderConsolidadoResultado();
  renderScoringAlert();
  renderScoringRAC();
}
function renderAll(){
  renderInicio();
  renderCliente();
  renderBalance();
  renderColateral();
  renderFlujo();
  renderConsolidado();
  renderScoring();
  renderResolucion();
  renderGuardadas();
}
document.addEventListener('DOMContentLoaded', () => {
  renderAll();
  goScreen('inicio');
  const renderMap = {
    inicio: renderInicio, cliente: null, balance: renderBalance, colateral: renderColateral,
    flujo: renderFlujo, consolidado: renderConsolidado, scoring: renderScoring, resolucion: renderResolucion, guardadas: renderGuardadas,
  };
  document.querySelectorAll('.topnav button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const fn = renderMap[b.dataset.nav];
      if (fn) fn();
      goScreen(b.dataset.nav);
    });
  });
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
});
